version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: amazing-abed-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-amazing_abed}
    # Expose only on internal docker network to avoid host port conflicts.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amazing-abed-redis
    # Expose only on internal docker network to avoid host port conflicts.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: amazing-abed-api
    ports:
      - "13001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/amazing_abed
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
      - PORT=3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: amazing-abed-worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/amazing_abed
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: amazing-abed-web
    ports:
      - "13000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/amazing_abed
      - NEXT_PUBLIC_API_URL=http://localhost:13001
      - NODE_ENV=production
    depends_on:
      - api

volumes:
  postgres_data:
